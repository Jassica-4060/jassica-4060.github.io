<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 595.2756 841.8898"><rect width="595.2756" height="841.8898" fill="white"/><path d="M187 0 H407 C407 61 358 107 297 107 C236 107 187 61 187 0 Z" fill="#353535"/><circle cx="297" cy="106" r="54" fill="#FFDF57" stroke="#FFDF57" stroke-width=".65"/><text x="270.0865" y="111" fill="#353535" font-family="Arial" font-size="19" font-weight="700" letter-spacing="0">C MIN</text><text x="280.02525" y="128" fill="#353535" font-family="Arial" font-size="6.5" font-weight="400" letter-spacing="1.2">DESIGNER</text><text x="42" y="100" fill="#353535" font-family="Arial Unicode MS" font-size="27" font-weight="400" letter-spacing="0">黃思敏</text><text x="43" y="120" fill="#353535" font-family="Arial" font-size="15" font-weight="700" letter-spacing="1">C MIN</text><text x="43" y="137" fill="#353535" font-family="Arial" font-size="7.3" font-weight="700" letter-spacing="1.1">PRODUCT DESIGNER</text><text x="376" y="104" fill="#353535" font-family="Arial Unicode MS" font-size="9.1" font-weight="400" letter-spacing="0">產品設計 × 產品規劃</text><text x="376" y="121" fill="#353535" font-family="Arial" font-size="8" font-weight="400" letter-spacing="0">Taipei, Taiwan</text><text x="376" y="138" fill="#353535" font-family="Arial Unicode MS" font-size="8" font-weight="400" letter-spacing="0">104 履歷  ↗</text><text x="270.9728" y="184" fill="#353535" font-family="Arial" font-size="10" font-weight="700" letter-spacing="0.6">ABOUT ME</text><text x="57" y="204" fill="#353535" font-family="Arial Unicode MS" font-size="9" font-weight="400" letter-spacing="0">累積 7 年 UI/UX 設計經驗，專注 SaaS 後台與系統化設計。從需求背後的「為什麼」出發，釐清使用者與業務目標，梳理</text><text x="57" y="218" fill="#353535" font-family="Arial Unicode MS" font-size="9" font-weight="400" letter-spacing="0">複雜流程，透過原型驗證方向；串聯產品與工程，將想法推進到實作。</text><rect x="117" y="244" width="112" height="18" fill="#FFDF57"/><text x="137.9" y="256.5" fill="#353535" font-family="Arial Unicode MS" font-size="7.8" font-weight="400" letter-spacing="0">需求洞察與產品規劃</text><rect x="241" y="244" width="112" height="18" fill="#FFDF57"/><text x="270.7740234375" y="256.5" fill="#353535" font-family="Arial Unicode MS" font-size="7.8" font-weight="400" letter-spacing="0">Design System</text><rect x="365" y="244" width="112" height="18" fill="#FFDF57"/><text x="385.9" y="256.5" fill="#353535" font-family="Arial Unicode MS" font-size="7.8" font-weight="400" letter-spacing="0">原型驗證與開發交付</text><text x="251.80280000000002" y="291" fill="#353535" font-family="Arial" font-size="10" font-weight="700" letter-spacing="0.6">CAREER TIMELINE</text><path d="M53 318 L542 318" fill="none" stroke="#353535" stroke-width="0.6"/><text x="52.351" y="308" fill="#353535" font-family="Arial" font-size="7" font-weight="700" letter-spacing="0">2018/05</text><circle cx="65" cy="318" r="3.2" fill="#FFDF57" stroke="#353535" stroke-width=".65"/><text x="49.0" y="334" fill="#353535" font-family="Arial Unicode MS" font-size="8" font-weight="400" letter-spacing="0">大學光學</text><text x="168.351" y="308" fill="#353535" font-family="Arial" font-size="7" font-weight="700" letter-spacing="0">2021/04</text><circle cx="181" cy="318" r="3.2" fill="#FFDF57" stroke="#353535" stroke-width=".65"/><text x="167.880859375" y="334" fill="#353535" font-family="Arial Unicode MS" font-size="8" font-weight="400" letter-spacing="0">CoolBe</text><text x="284.351" y="308" fill="#353535" font-family="Arial" font-size="7" font-weight="700" letter-spacing="0">2022/02</text><circle cx="297" cy="318" r="3.2" fill="#FFDF57" stroke="#353535" stroke-width=".65"/><text x="284.546875" y="334" fill="#353535" font-family="Arial Unicode MS" font-size="8" font-weight="400" letter-spacing="0">91APP</text><text x="400.351" y="308" fill="#353535" font-family="Arial" font-size="7" font-weight="700" letter-spacing="0">2022/09</text><circle cx="413" cy="318" r="3.2" fill="#FFDF57" stroke="#353535" stroke-width=".65"/><text x="397.0" y="334" fill="#353535" font-family="Arial Unicode MS" font-size="8" font-weight="400" letter-spacing="0">永豐金控</text><text x="516.351" y="308" fill="#353535" font-family="Arial" font-size="7" font-weight="700" letter-spacing="0">2023/10</text><circle cx="529" cy="318" r="3.2" fill="#FFDF57" stroke="#353535" stroke-width=".65"/><text x="515.880859375" y="334" fill="#353535" font-family="Arial Unicode MS" font-size="8" font-weight="400" letter-spacing="0">CoolBe</text><text x="248.18780000000004" y="368" fill="#353535" font-family="Arial" font-size="10" font-weight="700" letter-spacing="0.6">WORK EXPERIENCE</text><text x="53" y="392" fill="#353535" font-family="Arial" font-size="7.8" font-weight="700" letter-spacing="0">2023/10 - PRESENT</text><path d="M42 401 L285 401" fill="none" stroke="#353535" stroke-width="0.6"/><circle cx="53" cy="401" r="3.1" fill="#FFDF57" stroke="#353535" stroke-width=".65"/><text x="53" y="420" fill="#353535" font-family="Arial Unicode MS" font-size="10.4" font-weight="400" letter-spacing="0">酷必資訊 CoolBe</text><text x="53" y="435" fill="#656565" font-family="Arial Unicode MS" font-size="8.5" font-weight="400" letter-spacing="0">資深產品設計師</text><circle cx="54" cy="450" r="1.15" fill="#FFDF57" stroke="#FFDF57" stroke-width=".65"/><text x="62" y="453" fill="#353535" font-family="Arial Unicode MS" font-size="8.6" font-weight="400" letter-spacing="0">規劃 LINE WORKS MVP，採核心模組優先、加值服務分</text><text x="62" y="466" fill="#353535" font-family="Arial Unicode MS" font-size="8.6" font-weight="400" letter-spacing="0">階段導入。</text><circle cx="54" cy="481" r="1.15" fill="#FFDF57" stroke="#FFDF57" stroke-width=".65"/><text x="62" y="484" fill="#353535" font-family="Arial Unicode MS" font-size="8.6" font-weight="400" letter-spacing="0">承接 Bot 一對一服務，串接需求釐清、PRD、介面與 RD </text><text x="62" y="497" fill="#353535" font-family="Arial Unicode MS" font-size="8.6" font-weight="400" letter-spacing="0">開發規格。</text><circle cx="54" cy="512" r="1.15" fill="#FFDF57" stroke="#FFDF57" stroke-width=".65"/><text x="62" y="515" fill="#353535" font-family="Arial Unicode MS" font-size="8.6" font-weight="400" letter-spacing="0">導入 Design Token 與模組化元件，以 JSON 串接設計與</text><text x="62" y="528" fill="#353535" font-family="Arial Unicode MS" font-size="8.6" font-weight="400" letter-spacing="0">開發。</text><circle cx="54" cy="543" r="1.15" fill="#FFDF57" stroke="#FFDF57" stroke-width=".65"/><text x="62" y="546" fill="#353535" font-family="Arial Unicode MS" font-size="8.6" font-weight="400" letter-spacing="0">彙整 3 間成衣品牌需求，規劃 LINE OA「以圖搜圖」購買</text><text x="62" y="559" fill="#353535" font-family="Arial Unicode MS" font-size="8.6" font-weight="400" letter-spacing="0">路徑。</text><text x="321" y="392" fill="#353535" font-family="Arial" font-size="7.8" font-weight="700" letter-spacing="0">2022/09 - 2023/10</text><path d="M310 401 L553 401" fill="none" stroke="#353535" stroke-width="0.6"/><circle cx="321" cy="401" r="3.1" fill="#FFDF57" stroke="#353535" stroke-width=".65"/><text x="321" y="420" fill="#353535" font-family="Arial Unicode MS" font-size="10.4" font-weight="400" letter-spacing="0">永豐金融控股</text><text x="321" y="435" fill="#656565" font-family="Arial Unicode MS" font-size="8.5" font-weight="400" letter-spacing="0">UI/UX 設計師 · UI/UX 團隊 Leader</text><circle cx="322" cy="450" r="1.15" fill="#FFDF57" stroke="#FFDF57" stroke-width=".65"/><text x="330" y="453" fill="#353535" font-family="Arial Unicode MS" font-size="8.6" font-weight="400" letter-spacing="0">迭代行動網銀信用卡模組與大戶 APP，優化資訊層級及操</text><text x="330" y="466" fill="#353535" font-family="Arial Unicode MS" font-size="8.6" font-weight="400" letter-spacing="0">作流程。</text><circle cx="322" cy="481" r="1.15" fill="#FFDF57" stroke="#FFDF57" stroke-width=".65"/><text x="330" y="484" fill="#353535" font-family="Arial Unicode MS" font-size="8.6" font-weight="400" letter-spacing="0">建立新網銀 Design System，含 53 組元件與頁面範本，</text><text x="330" y="497" fill="#353535" font-family="Arial Unicode MS" font-size="8.6" font-weight="400" letter-spacing="0">推動共同維護。</text><circle cx="322" cy="512" r="1.15" fill="#FFDF57" stroke="#FFDF57" stroke-width=".65"/><text x="330" y="515" fill="#353535" font-family="Arial Unicode MS" font-size="8.6" font-weight="400" letter-spacing="0">從 0 到 1 規劃徵才網站並完成上線，整合 104 履歷快速匯</text><text x="330" y="528" fill="#353535" font-family="Arial Unicode MS" font-size="8.6" font-weight="400" letter-spacing="0">入。</text><circle cx="322" cy="543" r="1.15" fill="#FFDF57" stroke="#FFDF57" stroke-width=".65"/><text x="330" y="546" fill="#353535" font-family="Arial Unicode MS" font-size="8.6" font-weight="400" letter-spacing="0">主責 2 場 Workshop，並執行 1 場內部 A/B Test 回饋收集</text><text x="330" y="559" fill="#353535" font-family="Arial Unicode MS" font-size="8.6" font-weight="400" letter-spacing="0">。</text><text x="53" y="602" fill="#353535" font-family="Arial" font-size="7.8" font-weight="700" letter-spacing="0">2022/02 - 2022/09</text><path d="M42 611 L285 611" fill="none" stroke="#353535" stroke-width="0.6"/><circle cx="53" cy="611" r="3.1" fill="#FFDF57" stroke="#353535" stroke-width=".65"/><text x="53" y="630" fill="#353535" font-family="Arial Unicode MS" font-size="10.4" font-weight="400" letter-spacing="0">九易宇軒 91APP</text><text x="53" y="645" fill="#656565" font-family="Arial Unicode MS" font-size="8.5" font-weight="400" letter-spacing="0">產品設計師</text><circle cx="54" cy="660" r="1.15" fill="#FFDF57" stroke="#FFDF57" stroke-width=".65"/><text x="62" y="663" fill="#353535" font-family="Arial Unicode MS" font-size="8.6" font-weight="400" letter-spacing="0">負責「店員幫手」熟客管理新功能，從需求收斂、設計至</text><text x="62" y="676" fill="#353535" font-family="Arial Unicode MS" font-size="8.6" font-weight="400" letter-spacing="0">協作上線。</text><circle cx="54" cy="691" r="1.15" fill="#FFDF57" stroke="#FFDF57" stroke-width=".65"/><text x="62" y="694" fill="#353535" font-family="Arial Unicode MS" font-size="8.6" font-weight="400" letter-spacing="0">完成 30 位內部使用者測試，辨識 10 項問題並推動 2 項設</text><text x="62" y="707" fill="#353535" font-family="Arial Unicode MS" font-size="8.6" font-weight="400" letter-spacing="0">計調整。</text><text x="321" y="602" fill="#353535" font-family="Arial" font-size="7.8" font-weight="700" letter-spacing="0">2021/04 - 2022/02</text><path d="M310 611 L553 611" fill="none" stroke="#353535" stroke-width="0.6"/><circle cx="321" cy="611" r="3.1" fill="#FFDF57" stroke="#353535" stroke-width=".65"/><text x="321" y="630" fill="#353535" font-family="Arial Unicode MS" font-size="10.4" font-weight="400" letter-spacing="0">酷必資訊 CoolBe</text><text x="321" y="645" fill="#656565" font-family="Arial Unicode MS" font-size="8.5" font-weight="400" letter-spacing="0">UI/UX 設計師</text><circle cx="322" cy="660" r="1.15" fill="#FFDF57" stroke="#FFDF57" stroke-width=".65"/><text x="330" y="663" fill="#353535" font-family="Arial Unicode MS" font-size="8.6" font-weight="400" letter-spacing="0">負責產品前後台介面、流程優化，以及產品營運與行銷視</text><text x="330" y="676" fill="#353535" font-family="Arial Unicode MS" font-size="8.6" font-weight="400" letter-spacing="0">覺設計。</text><text x="321" y="715" fill="#353535" font-family="Arial" font-size="7.8" font-weight="700" letter-spacing="0">2018/05 - 2021/02</text><text x="321" y="731" fill="#353535" font-family="Arial Unicode MS" font-size="9.2" font-weight="400" letter-spacing="0">大學光學 · 平面設計師</text><text x="321" y="746" fill="#353535" font-family="Arial Unicode MS" font-size="8.6" font-weight="400" letter-spacing="0">門市文宣、產品包裝、社群廣告與網頁視覺。</text><path d="M42 770 L553 770" fill="none" stroke="#353535" stroke-width="0.6"/><text x="42" y="791" fill="#353535" font-family="Arial" font-size="8.5" font-weight="700" letter-spacing="0.7">SKILLS</text><text x="117" y="791" fill="#353535" font-family="Arial Unicode MS" font-size="8.2" font-weight="400" letter-spacing="0">複雜流程規劃  /  設計系統  /  Figma 互動原型  /  可用性測試</text><text x="117" y="807" fill="#353535" font-family="Arial Unicode MS" font-size="8.2" font-weight="400" letter-spacing="0">訪談與 GA4 行為分析  /  跨部門協作  /  視覺與品牌設計</text><text x="42" y="822" fill="#656565" font-family="Arial" font-size="6.1" font-weight="400" letter-spacing="0.6">C MIN / DESIGNER CV</text><text x="545.216" y="822" fill="#656565" font-family="Arial" font-size="7" font-weight="400" letter-spacing="0">01</text></svg>