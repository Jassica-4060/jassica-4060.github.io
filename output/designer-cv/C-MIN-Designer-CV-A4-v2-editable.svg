g="0">「為什麼」出發，釐清使用者與業務目標，讓複雜需求成為清楚</text><text x="294" y="136" fill="#152c4c" font-family="Arial Unicode MS" font-size="9.5" font-weight="400" letter-spacing="0">好用的產品體驗。</text><text x="294" y="193" fill="#152c4c" font-family="Arial Unicode MS" font-size="9.5" font-weight="400" letter-spacing="0">透過原型驗證方向，串聯產品與工程，將需求規劃推進到實作。</text><text x="294" y="260" fill="#152c4c" font-family="Arial" font-size="14" font-weight="700" letter-spacing="0">WORK EXPERIENCE</text><rect x="294" y="273" width="35" height="4" fill="#ffc23d"/><path d="M300 298 L300 746" fill="none" stroke="#152c4c" stroke-width="1"/><rect x="296.0" y="292.0" width="8" height="8" fill="#ffffff"/><path d="M296.0 292.0 L304.0 292.0" fill="none" stroke="#152c4c" stroke-width="1.2"/><path d="M304.0 292.0 L304.0 300.0" fill="none" stroke="#152c4c" stroke-width="1.2"/><path d="M304.0 300.0 L296.0 300.0" fill="none" stroke="#152c4c" stroke-width="1.2"/><path d="M296.0 300.0 L296.0 292.0" fill="none" stroke="#152c4c" stroke-width="1.2"/><text x="315" y="300" fill="#152c4c" font-family="Arial Unicode MS" font-size="10.8" font-weight="400" letter-spacing="0">酷必資訊 CoolBe</text><text x="315" y="317" fill="#152c4c" font-family="Arial Unicode MS" font-size="9.1" font-weight="400" letter-spacing="0">資深產品設計師</text><text x="315" y="333" fill="#46576b" font-family="Arial" font-size="7.6" font-weight="700" letter-spacing="0">2023/10 - PRESENT</text><text x="315" y="351" fill="#152c4c" font-family="Arial Unicode MS" font-size="8.8" font-weight="400" letter-spacing="0">規劃 LINE WORKS MVP，核心模組優先、加值服務分階段導</text><text x="315" y="364" fill="#152c4c" font-family="Arial Unicode MS" font-size="8.8" font-weight="400" letter-spacing="0">入。</text><text x="315" y="382" fill="#152c4c" font-family="Arial Unicode MS" font-size="8.8" font-weight="400" letter-spacing="0">串接 Bot 一對一服務的需求、PRD、介面與開發規格；導入 </text><text x="315" y="395" fill="#152c4c" font-family="Arial Unicode MS" font-size="8.8" font-weight="400" letter-spacing="0">Token 與模組化元件。</text><text x="315" y="413" fill="#152c4c" font-family="Arial Unicode MS" font-size="8.8" font-weight="400" letter-spacing="0">彙整 3 間成衣品牌需求，規劃 LINE OA「以圖搜圖」功能。</text><rect x="296.0" y="442.0" width="8" height="8" fill="#ffffff"/><path d="M296.0 442.0 L304.0 442.0" fill="none" stroke="#152c4c" stroke-width="1.2"/><path d="M304.0 442.0 L304.0 450.0" fill="none" stroke="#152c4c" stroke-width="1.2"/><path d="M304.0 450.0 L296.0 450.0" fill="none" stroke="#152c4c" stroke-width="1.2"/><path d="M296.0 450.0 L296.0 442.0" fill="none" stroke="#152c4c" stroke-width="1.2"/><text x="315" y="450" fill="#152c4c" font-family="Arial Unicode MS" font-size="10.8" font-weight="400" letter-spacing="0">永豐金融控股</text><text x="315" y="467" fill="#152c4c" font-family="Arial Unicode MS" font-size="9.1" font-weight="400" letter-spacing="0">UI/UX 設計師 · UI/UX 團隊 Leader</text><text x="315" y="483" fill="#46576b" font-family="Arial" font-size="7.6" font-weight="700" letter-spacing="0">2022/09 - 2023/10</text><text x="315" y="501" fill="#152c4c" font-family="Arial Unicode MS" font-size="8.8" font-weight="400" letter-spacing="0">優化行動網銀信用卡模組與大戶 APP；建立 53 組元件與頁面</text><text x="315" y="514" fill="#152c4c" font-family="Arial Unicode MS" font-size="8.8" font-weight="400" letter-spacing="0">範本。</text><text x="315" y="532" fill="#152c4c" font-family="Arial Unicode MS" font-size="8.8" font-weight="400" letter-spacing="0">徵才網站從規劃到上線，整合 104 履歷匯入；主責 2 場 </text><text x="315" y="545" fill="#152c4c" font-family="Arial Unicode MS" font-size="8.8" font-weight="400" letter-spacing="0">Workshop。</text><rect x="296.0" y="566.0" width="8" height="8" fill="#ffffff"/><path d="M296.0 566.0 L304.0 566.0" fill="none" stroke="#152c4c" stroke-width="1.2"/><path d="M304.0 566.0 L304.0 574.0" fill="none" stroke="#152c4c" stroke-width="1.2"/><path d="M304.0 574.0 L296.0 574.0" fill="none" stroke="#152c4c" stroke-width="1.2"/><path d="M296.0 574.0 L296.0 566.0" fill="none" stroke="#152c4c" stroke-width="1.2"/><text x="315" y="574" fill="#152c4c" font-family="Arial Unicode MS" font-size="10.8" font-weight="400" letter-spacing="0">九易宇軒 91APP</text><text x="315" y="591" fill="#152c4c" font-family="Arial Unicode MS" font-size="9.1" font-weight="400" letter-spacing="0">產品設計師</text><text x="315" y="607" fill="#46576b" font-family="Arial" font-size="7.6" font-weight="700" letter-spacing="0">2022/02 - 2022/09</text><text x="315" y="625" fill="#152c4c" font-family="Arial Unicode MS" font-size="8.8" font-weight="400" letter-spacing="0">負責「店員幫手」熟客管理新功能至上線；完成 30 人測試，辨</text><text x="315" y="638" fill="#152c4c" font-family="Arial Unicode MS" font-size="8.8" font-weight="400" letter-spacing="0">識 10 項問題，推動 2 項設計調整。</text><rect x="296.0" y="664.0" width="8" height="8" fill="#ffffff"/><path d="M296.0 664.0 L304.0 664.0" fill="none" stroke="#152c4c" stroke-width="1.2"/><path d="M304.0 664.0 L304.0 672.0" fill="none" stroke="#152c4c" stroke-width="1.2"/><path d="M304.0 672.0 L296.0 672.0" fill="none" stroke="#152c4c" stroke-width="1.2"/><path d="M296.0 672.0 L296.0 664.0" fill="none" stroke="#152c4c" stroke-width="1.2"/><text x="315" y="672" fill="#152c4c" font-family="Arial Unicode MS" font-size="10.8" font-weight="400" letter-spacing="0">酷必資訊 CoolBe</text><text x="315" y="689" fill="#152c4c" font-family="Arial Unicode MS" font-size="9.1" font-weight="400" letter-spacing="0">UI/UX 設計師</text><text x="315" y="705" fill="#46576b" font-family="Arial" font-size="7.6" font-weight="700" letter-spacing="0">2021/04 - 2022/02</text><text x="315" y="723" fill="#152c4c" font-family="Arial Unicode MS" font-size="8.8" font-weight="400" letter-spacing="0">前後台介面、流程優化與行銷視覺設計。</text><rect x="296.0" y="738.0" width="8" height="8" fill="#ffffff"/><path d="M296.0 738.0 L304.0 738.0" fill="none" stroke="#152c4c" stroke-width="1.2"/><path d="M304.0 738.0 L304.0 746.0" fill="none" stroke="#152c4c" stroke-width="1.2"/><path d="M304.0 746.0 L296.0 746.0" fill="none" stroke="#152c4c" stroke-width="1.2"/><path d="M296.0 746.0 L296.0 738.